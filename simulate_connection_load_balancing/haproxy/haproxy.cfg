# HAProxy as a TCP (layer 4) load balancer in front of PostgreSQL.
#
# Two entry points, as most PostgreSQL HA setups expose:
#   :5000  write endpoint → the primary only
#   :5001  read endpoint  → replicas, round-robin, primary as last-resort backup
#
# HAProxy doesn't parse SQL: it balances CONNECTIONS, not queries. Every query sent
# on a connection goes to the backend picked when that connection was opened.

global
    log stdout format raw local0 info
    # Runtime API, handy for `echo "show servers state" | socat ...` while exploring.
    stats socket /tmp/haproxy.sock mode 600 level admin

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 3s
    # Database sessions are long-lived and can sit idle in a pool; don't cut them.
    timeout client 30m
    timeout server 30m
    # Health checks every 1s; 2 failures → DOWN, 2 successes → UP again.
    # init-addr none: start even if a backend's DNS name doesn't resolve yet.
    default-server inter 1s fall 2 rise 2 resolvers docker init-addr last,libc,none

# Use Docker's embedded DNS so stopped/restarted containers are re-resolved.
resolvers docker
    nameserver dns1 127.0.0.11:53
    hold valid 1s

listen pg_write
    bind :5000
    # pgsql-check sends a PostgreSQL startup packet and expects an authentication
    # request back — i.e. "a PostgreSQL server is answering", not just "port open".
    option pgsql-check user postgres
    # When a server goes DOWN, kill its sessions so clients reconnect elsewhere
    # instead of hanging on a dead TCP connection.
    default-server on-marked-down shutdown-sessions
    server primary pg_primary:5432 check

listen pg_read
    bind :5001
    # roundrobin spreads new connections evenly. leastconn suits very uneven,
    # long-lived connections better.
    balance roundrobin
    option pgsql-check user postgres
    default-server on-marked-down shutdown-sessions
    server replica1 pg_replica1:5432 check
    server replica2 pg_replica2:5432 check
    # 'backup' servers get traffic only when every non-backup server is DOWN.
    server primary  pg_primary:5432  check backup

# Built-in dashboard + CSV export (http://localhost:8404/stats, add ;csv for CSV).
listen stats
    mode http
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 2s
