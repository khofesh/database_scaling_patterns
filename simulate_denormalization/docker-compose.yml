services:
  # A single PostgreSQL instance. The normalized tables are the source of truth;
  # redundant (denormalized) columns on `orders` are kept in sync by triggers.
  postgres:
    image: postgres:18-bookworm
    container_name: denorm_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop
    ports:
      - "5521:5432"
    volumes:
      - denorm_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      # TCP check: stays unhealthy until first-boot seeding has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d shop"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  denorm_data:
