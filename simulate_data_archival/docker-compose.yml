services:
  # A single PostgreSQL instance with a hot `orders` table, an `orders_archive`
  # table tuned for cold data, and a directory (inside the data volume) that stands
  # in for cheap object storage for compressed exports.
  postgres:
    image: postgres:18-bookworm
    container_name: archival_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop
    ports:
      - "5531:5432"
    volumes:
      - archival_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      # TCP check: stays unhealthy until first-boot seeding has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d shop"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  archival_data:
