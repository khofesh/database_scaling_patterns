services:
  # Two WRITABLE PostgreSQL nodes ("multi-primary" / "active-active"). Each node
  # publishes its changes and subscribes to the other's using native logical
  # replication. wal_level=logical is required for publications; track_commit_timestamp
  # lets PostgreSQL detect (and count) conflicts where a row was last modified by a
  # different origin. cluster_name identifies the node in our rows and conflict logs.
  node_a:
    image: postgres:18-bookworm
    container_name: multi_primary_a
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - track_commit_timestamp=on
      - -c
      - cluster_name=node_a
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      NODE_ID: 1
    ports:
      - "5500:5432"
    volumes:
      - multi_primary_a_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  node_b:
    image: postgres:18-bookworm
    container_name: multi_primary_b
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - track_commit_timestamp=on
      - -c
      - cluster_name=node_b
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      NODE_ID: 2
    ports:
      - "5501:5432"
    volumes:
      - multi_primary_b_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  multi_primary_a_data:
  multi_primary_b_data:
