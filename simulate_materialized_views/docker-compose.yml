services:
  # A single PostgreSQL instance. Materialized views are a single-node technique:
  # they trade storage + refresh work for much cheaper reads of an expensive query.
  postgres:
    image: postgres:18-bookworm
    container_name: matviews_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop
    ports:
      - "5505:5432"
    volumes:
      - matviews_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      # -h 127.0.0.1: during first-boot init the server only listens on a unix socket,
      # so a TCP check stays unhealthy until seeding has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d shop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  matviews_data:
