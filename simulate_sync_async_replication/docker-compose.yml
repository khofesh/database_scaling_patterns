services:
  # Primary - accepts writes. Which standbys (if any) a COMMIT must wait for is
  # controlled at runtime by synchronous_standby_names (changed by the Go program
  # with ALTER SYSTEM + pg_reload_conf(), no restart needed).
  postgres_primary:
    image: postgres:18-bookworm
    container_name: syncrep_primary
    command: ["postgres", "-c", "wal_keep_size=256MB"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5502:5432"
    volumes:
      - syncrep_primary_data:/var/lib/postgresql/data
      - ./init/primary:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Standby "s1" - physical streaming standby. STANDBY_NAME is reported to the
  # primary as application_name, which synchronous_standby_names refers to.
  standby_s1:
    image: postgres:18-bookworm
    container_name: syncrep_s1
    environment:
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: postgres_primary
      REPLICATOR_PASSWORD: replicator
      STANDBY_NAME: s1
    ports:
      - "5503:5432"
    volumes:
      - syncrep_s1_data:/var/lib/postgresql/data
      - ./init/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]
    depends_on:
      postgres_primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Standby "s2" - second standby, used for quorum (ANY n) commit.
  standby_s2:
    image: postgres:18-bookworm
    container_name: syncrep_s2
    environment:
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: postgres_primary
      REPLICATOR_PASSWORD: replicator
      STANDBY_NAME: s2
    ports:
      - "5504:5432"
    volumes:
      - syncrep_s2_data:/var/lib/postgresql/data
      - ./init/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]
    depends_on:
      postgres_primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  syncrep_primary_data:
  syncrep_s1_data:
  syncrep_s2_data:
